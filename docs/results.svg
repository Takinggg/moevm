<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="t d">
  <title id="t">MoEVM decode throughput on a 48 GB Apple M5 Pro</title>
  <desc id="d">Qwen3-Coder-Next Q4_K_M, 45.2 GiB: llama.cpp with the op-offload path and MoEVM off decodes 6.41 tokens per second; with MoEVM on, 19.90 tokens per second, 3.1 times faster, with bit-identical logits. gpt-oss-120b Q4_K_M, 58 GiB: MoEVM decodes 8.72 tokens per second, median of 5 runs at a 4096-token context.</desc>
  <style>
    .surface { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
    .t1 { fill: #0b0b0b; }
    .t2 { fill: #52514e; }
    .t3 { fill: #898781; }
    .grid { stroke: #e1e0d9; stroke-width: 1; }
    .axis { stroke: #c3c2b7; stroke-width: 1; }
    .base { fill: #898781; }
    .moevm { fill: #2a78d6; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: 600; }
    .head { font-size: 13px; font-weight: 600; }
    .small { font-size: 12px; }
    .tiny { font-size: 11px; }
    .value { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .tick { font-size: 11px; font-variant-numeric: tabular-nums; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
      .t1 { fill: #ffffff; }
      .t2 { fill: #c3c2b7; }
      .grid { stroke: #2c2c2a; }
      .axis { stroke: #383835; }
      .moevm { fill: #3987e5; }
    }
  </style>

  <rect class="surface" x="0.5" y="0.5" width="759" height="339" rx="12"/>
  <text class="title t1" x="24" y="34">Decode throughput on a 48 GB Apple M5 Pro</text>
  <text class="small t2" x="24" y="53">Tokens per second, higher is better. One sequence, greedy decoding, routing traces off.</text>

  <!-- x scale: 0..25 tok/s over x = 260..700 (17.6 px per tok/s) -->
  <g class="grid">
    <line x1="260" y1="118" x2="260" y2="186"/><line x1="348" y1="118" x2="348" y2="186"/>
    <line x1="436" y1="118" x2="436" y2="186"/><line x1="524" y1="118" x2="524" y2="186"/>
    <line x1="612" y1="118" x2="612" y2="186"/><line x1="700" y1="118" x2="700" y2="186"/>
    <line x1="348" y1="244" x2="348" y2="282"/><line x1="436" y1="244" x2="436" y2="282"/>
    <line x1="524" y1="244" x2="524" y2="282"/><line x1="612" y1="244" x2="612" y2="282"/>
    <line x1="700" y1="244" x2="700" y2="282"/>
  </g>

  <!-- Panel 1: Qwen3-Coder-Next -->
  <text class="head t1" x="24" y="88">Qwen3-Coder-Next Q4_K_M · 45.2 GiB, over Metal's 40.2 GB working-set limit</text>
  <text class="small t2" x="24" y="106">Same prompt and flags, 1024 tokens. Logits bit-identical to the run with MoEVM off.</text>

  <text class="small t2" x="248" y="139" text-anchor="end">llama.cpp --op-offload, MoEVM off</text>
  <path class="base" d="M260 124 H368.8 a4 4 0 0 1 4 4 V142 a4 4 0 0 1 -4 4 H260 Z"><title>MoEVM off: 6.41 tok/s</title></path>
  <text class="value t1" x="380.8" y="140">6.41</text>

  <text class="small t1" x="248" y="171" text-anchor="end" font-weight="600">MoEVM</text>
  <path class="moevm" d="M260 156 H606.2 a4 4 0 0 1 4 4 V174 a4 4 0 0 1 -4 4 H260 Z"><title>MoEVM on: 19.90 tok/s, 3.1x</title></path>
  <text class="value t1" x="618.2" y="172">19.90 <tspan class="t2" font-weight="400">(3.1×)</tspan></text>

  <line class="axis" x1="260" y1="118" x2="260" y2="186"/>

  <!-- Panel 2: gpt-oss-120b -->
  <text class="head t1" x="24" y="214">gpt-oss-120b Q4_K_M · 58 GiB, more than the machine's 48 GB of RAM</text>
  <text class="small t2" x="24" y="232">4096-token context, 990-token prompt. Median of 5 runs, zero demand reads.</text>

  <text class="small t1" x="248" y="263" text-anchor="end" font-weight="600">MoEVM</text>
  <path class="moevm" d="M260 248 H409.5 a4 4 0 0 1 4 4 V266 a4 4 0 0 1 -4 4 H260 Z"><title>MoEVM on gpt-oss-120b: 8.72 tok/s, median of 5</title></path>
  <text class="value t1" x="421.5" y="264">8.72</text>

  <line class="axis" x1="260" y1="244" x2="260" y2="282"/>

  <!-- shared axis ticks -->
  <g class="tick t3" text-anchor="middle">
    <text x="260" y="298">0</text><text x="348" y="298">5</text><text x="436" y="298">10</text>
    <text x="524" y="298">15</text><text x="612" y="298">20</text><text x="700" y="298">25</text>
  </g>

  <text class="tiny t3" x="24" y="324">Baseline: the same llama.cpp fork with MoEVM off. Raw logs: runs/evidence/. Not a claim that MoEVM beats llama.cpp in general.</text>
</svg>
